{% extends "base.html" %}
{% block title %}Set New Password - ResQConnect{% endblock %}
{% block content %}
<main class="auth-page">
  <section class="auth-card" style="max-width: 480px;">
    <div class="brand-lockup">
      <span class="brand-mark">RQ</span>
      <div>
        <strong>ResQConnect</strong>
        <small>Real-Time Disaster Response and Coordination</small>
      </div>
    </div>
    <h1>Set New Password</h1>
    <p>Please enter your new password below.</p>

    <form method="post" action="{{ url_for('auth.reset_password_post', token=token) }}" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>New Password
        <input name="password" type="password" required autocomplete="new-password" placeholder="At least 8 characters" autofocus>
      </label>
      <label>Confirm New Password
        <input name="confirm_password" type="password" required autocomplete="new-password" placeholder="Re-enter new password">
      </label>
      <button class="button button-primary" type="submit" style="margin-top: 0.5rem;">Update Password</button>
    </form>
  </section>
</main>
{% endblock %}
